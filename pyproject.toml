[project]
name = "repo2graph"
version = "1.4.0"
description = "Turn any repository into a code graph + graph-aware RAG chunks"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[project.scripts]
repo2graph = "repo2graph.cli:main"
repo2graph-mcp = "repo2graph.mcp:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo2graph*"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
# Strictly optional: the GraphRAG layer falls back to BM25 + the identifier
# boost with zero extra dependencies when these are not installed.
rag = ["sentence-transformers>=3.0", "numpy>=1.24"]
# Only `repo2graph-mcp` needs this; the CLI and the Action never import it.
# Bounded below 2 on purpose: `serve()` drives the 1.x decorator API
# (`@server.list_tools()` / `@server.call_tool()`), which mcp 2.x removed. An
# unbounded `mcp>=1.0` resolves to 2.x today and crashes the server on start.
# See docs/BACKLOG.md ("Port the MCP server to the 2.x SDK API").
mcp = ["mcp>=1.0,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E702", "E731", "E741"]
