name: Publish

# Unified Release Pipeline:
# 1. prepare-release: Bumps version across all files, commits, tags, and validates consistency.
# 2. publish: Tests and publishes to PyPI via OIDC, waits for CDN, then publishes to the MCP Registry.
# 3. release: Creates GitHub Release from CHANGELOG.md and advances the floating major tag (e.g. v1).
#
# Can be triggered via:
# - workflow_dispatch (Actions UI): provide version (e.g. 1.5.2) or bump keyword ('patch', 'minor', 'major').
# - tag push (e.g. git push origin v1.5.2): validates consistency and runs publish + release.
# - GitHub Release published event.

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: prepare-release
  # --------------------------------------------------------------------------
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv and tooling
        run: pip install uv

      - name: Prepare release version and tag
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Scanning changes and determining version bump automatically..."
            python scripts/bump_version.py auto
            version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            tag="v$version"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml server.json repo2graph/__init__.py CHANGELOG.md uv.lock

            if ! git diff --cached --quiet; then
              git commit -m "chore(release): bump version to $version"
              git push origin "HEAD:${{ github.ref_name }}"
            fi

            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              git tag -a "$tag" -m "Release $tag"
              git push origin "refs/tags/$tag"
            fi
          else
            RAW_TAG="${RELEASE_TAG:-$REF_NAME}"
            case "$RAW_TAG" in
              v[0-9]*) ;;
              *) echo "::error::Tag '$RAW_TAG' is not of the form vX.Y.Z"; exit 1 ;;
            esac
            version="${RAW_TAG#v}"
            tag="$RAW_TAG"
          fi

          # Assert version consistency across pyproject.toml, server.json, and repo2graph/__init__.py
          python scripts/check_version.py

          # Verify server.json carries ownership marker in README.md
          name=$(python -c "import json;print(json.load(open('server.json'))['name'])")
          if ! grep -qF "mcp-name: $name" README.md; then
            echo "::error::README.md is missing the line 'mcp-name: $name'"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # Stage 2: publish (PyPI + MCP Registry)
  # --------------------------------------------------------------------------
  pypi:
    needs: prepare-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/repo2graph
    permissions:
      id-token: write        # mints short-lived Trusted Publishing token
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Run test suite before building
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"
          python -m pytest -q

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata PyPI will render
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  mcp-registry:
    needs: [prepare-release, pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # mcp-publisher login github-oidc needs this
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Wait for PyPI to serve the new version
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/repo2graph/$VERSION/json" > /dev/null; then
              echo "repo2graph $VERSION is live on PyPI"
              exit 0
            fi
            echo "attempt $attempt: not visible yet, waiting 10s"
            sleep 10
          done
          echo "::error::repo2graph $VERSION never appeared on PyPI"
          exit 1

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish

  # --------------------------------------------------------------------------
  # Stage 3: release (GitHub Release + Floating Major Tag)
  # --------------------------------------------------------------------------
  release:
    needs: [prepare-release, pypi, mcp-registry]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          fetch-depth: 0

      - name: Extract this version's CHANGELOG section
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY' > release-notes.md
          import os, re, sys, pathlib
          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf8")
          pattern = re.compile(
              r"^## \[?" + re.escape(version) + r"\]?.*?$(.*?)(?=^## |\Z)",
              re.M | re.S)
          match = pattern.search(text)
          if not match or not match.group(1).strip():
              print(f"::error::CHANGELOG.md has no section for {version}",
                    file=sys.stderr)
              raise SystemExit(1)
          print(match.group(1).strip())
          PY
          test -s release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating notes..."
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi

      - name: Advance floating major tag
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          major="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"
          echo "Advanced floating tag $major to $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Release summary
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          {
            echo "### Published and Released repo2graph $VERSION"
            echo
            echo "- **PyPI**: https://pypi.org/project/repo2graph/$VERSION/"
            echo "- **MCP Registry**: \`io.github.Srinivasan-78/repo2graph\`"
            echo "- **GitHub Release**: https://github.com/Srinivasan-78/repo2graph/releases/tag/v$VERSION"
            echo
            echo '```bash'
            echo "uvx --from 'repo2graph[mcp]' repo2graph-mcp /path/to/project"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
